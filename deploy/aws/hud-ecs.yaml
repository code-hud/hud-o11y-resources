# Generated by scripts/unify.py from parts/observability-data.yaml, ecs-fargate.yaml, hud-access.yaml, parts/observability-ui.yaml, parts/observability-attach.yaml. Do not edit.
AWSTemplateFormatVersion: '2010-09-09'
Description: 'Hud on ECS Fargate, in one stack: the Hud OpenTelemetry collector in your ECS cluster, the Observability data it writes to (OpenSearch Serverless, OpenSearch Ingestion, Amazon Managed Service for Prometheus; uniquely named), a read-only role Hud can assume to query it, and a new OpenSearch UI app or your existing one (ExistingUiAppId).'
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
    - Label:
        default: Observability Stack
      Parameters:
      - NamePrefix
      - MinUnits
      - MaxUnits
      - ServiceMapWindow
      - DataWritePrincipals
    - Label:
        default: Where to run
      Parameters:
      - ClusterName
      - VpcId
      - SubnetIds
      - AssignPublicIp
      - AllowedCidr
    - Label:
        default: Collector
      Parameters:
      - Mode
      - ExportInterval
      - Cpu
      - Memory
      - CpuArchitecture
      - DesiredCount
      - Image
    - Label:
        default: Discovery
      Parameters:
      - DnsNamespace
    - Label:
        default: Hud access
      Parameters:
      - ExternalId
    - Label:
        default: OpenSearch UI (optional)
      Parameters:
      - ExistingUiAppId
Parameters:
  NamePrefix:
    Type: String
    Default: hud
    AllowedPattern: ^[a-z][a-z0-9-]{2,15}$
    Description: Start of the collection, pipeline, AMP workspace and policy names. The stack adds a unique suffix, e.g. hud-1a2b3c4d (3-16 lowercase characters).
  MinUnits:
    Type: Number
    Default: 1
    Description: Minimum OpenSearch Ingestion capacity (ICUs).
  MaxUnits:
    Type: Number
    Default: 4
  ServiceMapWindow:
    Type: String
    Default: 30s
  DataWritePrincipals:
    Type: String
    Default: ''
    Description: Optional. Comma-separated IAM role or user ARNs (no spaces) that may also write to the collection (create and update indexes and documents). Everyone in your account can already read it; empty means only the pipeline writes.
  ClusterName:
    Type: String
    Description: Your existing ECS cluster to run the collector in.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: The VPC the collector runs in. The subnets below must be in this VPC.
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Public subnets (with a route to an internet gateway) for the collector tasks, so they can pull the image and reach AMP and OpenSearch Ingestion. For private subnets with a NAT gateway, set AssignPublicIp to DISABLED. They must be in the chosen VPC.
  AssignPublicIp:
    Type: String
    Default: ENABLED
    AllowedValues:
    - ENABLED
    - DISABLED
    Description: ENABLED for public subnets. DISABLED only for private subnets with a NAT gateway.
  AllowedCidr:
    Type: String
    Description: Your VPC's CIDR (or the CIDR of the apps that send to the collector), e.g. 10.0.0.0/16. Find it in the VPC console. Opens only port 4318; 0.0.0.0/0 is rejected.
    AllowedPattern: ^\d{1,3}(\.\d{1,3}){3}/\d{1,2}$
  Mode:
    Type: String
    Default: merge
    AllowedValues:
    - merge
    - convert
    Description: merge = function metrics (code.function.*) from all your app instances add into one series per collector task and deployment, labelled with deployment_id, telemetry_sdk_version and the environment, namespace and cloud; for totals across deployments use sum without (deployment_id, telemetry_sdk_version). Flow and process metrics stay one series per app instance. convert = one series per app instance for every metric.
  ExportInterval:
    Type: Number
    Default: 300
    MinValue: 10
    MaxValue: 3600
    Description: Seconds between writes of the merged function-metric totals to AMP (merge mode only). 300 is the Hud SDK's default metric interval.
  Cpu:
    Type: Number
    Default: 1024
    AllowedValues:
    - 512
    - 1024
    - 2048
    - 4096
  Memory:
    Type: Number
    Default: 4096
    Description: MiB. 4096 is recommended. Must be a valid Fargate size for the chosen Cpu.
  CpuArchitecture:
    Type: String
    Default: ARM64
    AllowedValues:
    - ARM64
    - X86_64
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 1
  Image:
    Type: String
    Default: ghcr.io/code-hud/hud-otel-collector:0.163.2-hud.3
    Description: Public image, or a copy in your account's ECR.
  DnsNamespace:
    Type: String
    Default: hud.internal
    AllowedPattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)*$
    Description: Private DNS namespace for the collector. A VPC can hold only one namespace with a given name, so a second Hud install in the same VPC needs a different value, e.g. hud2.internal. Your apps send to hud-collector.<name>:4318 (the OtlpEndpoint output). Lowercase letters, digits, hyphens and dots; not a domain you use publicly.
  ExternalId:
    Type: String
    MinLength: 2
    MaxLength: 1224
    AllowedPattern: ^[\w+=,.@:/-]+$
    Description: Prefilled by Hud's onboarding link and unique to you. Don't change it; Hud sends it when assuming the role, so with any other value Hud can't read your data.
  ExistingUiAppId:
    Type: String
    Default: ''
    AllowedPattern: ^([a-z0-9]{3,30})?$
    Description: Empty creates a new OpenSearch UI application with an Observability workspace. If you already have one, put its id here (aws opensearch list-applications) to add Hud's collection and AMP workspace to it as data sources instead; your other data sources are kept.
Rules:
  SubnetsInVpc:
    Assertions:
    - Assert: !Not
      - !EachMemberIn
        - !Ref 'SubnetIds'
        - - ''
      AssertDescription: Pick at least one subnet for the collector tasks.
    - Assert: !EachMemberEquals
      - !ValueOfAll
        - AWS::EC2::Subnet::Id
        - VpcId
      - !Ref 'VpcId'
      AssertDescription: The subnets must be in the VPC you picked.
  AllowedCidrNotPublic:
    Assertions:
    - Assert: !Not
      - !Equals
        - !Ref 'AllowedCidr'
        - 0.0.0.0/0
      AssertDescription: AllowedCidr must not be 0.0.0.0/0. The tasks have public IPs, so that would open the collector to the internet.
Conditions:
  HasDataWritePrincipals: !Not
  - !Equals
    - !Ref 'DataWritePrincipals'
    - ''
  Merge: !Equals
  - !Ref 'Mode'
  - merge
  AttachToUi: !Not
  - !Equals
    - !Ref 'ExistingUiAppId'
    - ''
  NewUi: !Equals
  - !Ref 'ExistingUiAppId'
  - ''
Resources:
  EncryptionPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name: !Sub
      - ${Name}-enc
      - Name: !Join
        - '-'
        - - !Ref 'NamePrefix'
          - !Select
            - 0
            - !Split
              - '-'
              - !Select
                - 2
                - !Split
                  - /
                  - !Ref 'AWS::StackId'
      Type: encryption
      Policy: !Sub
      - '{"Rules":[{"ResourceType":"collection","Resource":["collection/${Name}"]}],"AWSOwnedKey":true}'
      - Name: !Join
        - '-'
        - - !Ref 'NamePrefix'
          - !Select
            - 0
            - !Split
              - '-'
              - !Select
                - 2
                - !Split
                  - /
                  - !Ref 'AWS::StackId'
  NetworkPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name: !Sub
      - ${Name}-net
      - Name: !Join
        - '-'
        - - !Ref 'NamePrefix'
          - !Select
            - 0
            - !Split
              - '-'
              - !Select
                - 2
                - !Split
                  - /
                  - !Ref 'AWS::StackId'
      Type: network
      Policy: !Sub
      - '[{"Rules":[{"ResourceType":"collection","Resource":["collection/${Name}"]},{"ResourceType":"dashboard","Resource":["collection/${Name}"]}],"AllowFromPublic":true}]'
      - Name: !Join
        - '-'
        - - !Ref 'NamePrefix'
          - !Select
            - 0
            - !Split
              - '-'
              - !Select
                - 2
                - !Split
                  - /
                  - !Ref 'AWS::StackId'
  Collection:
    Type: AWS::OpenSearchServerless::Collection
    DependsOn:
    - EncryptionPolicy
    - NetworkPolicy
    Properties:
      Name: !Join
      - '-'
      - - !Ref 'NamePrefix'
        - !Select
          - 0
          - !Split
            - '-'
            - !Select
              - 2
              - !Split
                - /
                - !Ref 'AWS::StackId'
      Type: SEARCH
  Workspace:
    Type: AWS::APS::Workspace
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Alias: !Join
      - '-'
      - - !Ref 'NamePrefix'
        - !Select
          - 0
          - !Split
            - '-'
            - !Select
              - 2
              - !Split
                - /
                - !Ref 'AWS::StackId'
  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: osis-pipelines.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: write
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - aoss:APIAccessAll
            - aoss:BatchGetCollection
            Resource: !Sub 'arn:${AWS::Partition}:aoss:${AWS::Region}:${AWS::AccountId}:collection/*'
          - Effect: Allow
            Action: aps:RemoteWrite
            Resource: !GetAtt 'Workspace.Arn'
  DataAccessPolicy:
    Type: AWS::OpenSearchServerless::AccessPolicy
    Properties:
      Name: !Sub
      - ${Name}-access
      - Name: !Join
        - '-'
        - - !Ref 'NamePrefix'
          - !Select
            - 0
            - !Split
              - '-'
              - !Select
                - 2
                - !Split
                  - /
                  - !Ref 'AWS::StackId'
      Type: data
      Policy: !Sub
      - '[{"Rules":[ {"ResourceType":"index","Resource":["index/${Name}/*"],"Permission":["aoss:CreateIndex","aoss:UpdateIndex","aoss:DescribeIndex","aoss:ReadDocument","aoss:WriteDocument"]}, {"ResourceType":"collection","Resource":["collection/${Name}"],"Permission":["aoss:CreateCollectionItems","aoss:DeleteCollectionItems","aoss:UpdateCollectionItems","aoss:DescribeCollectionItems"]}], "Principal":["${PipelineRole.Arn}"]}, {"Rules":[ {"ResourceType":"index","Resource":["index/${Name}/*"],"Permission":["aoss:DescribeIndex","aoss:ReadDocument"]}, {"ResourceType":"collection","Resource":["collection/${Name}"],"Permission":["aoss:DescribeCollectionItems"]}], "Principal":["arn:${AWS::Partition}:iam::${AWS::AccountId}:root"]}]'
      - Name: !Join
        - '-'
        - - !Ref 'NamePrefix'
          - !Select
            - 0
            - !Split
              - '-'
              - !Select
                - 2
                - !Split
                  - /
                  - !Ref 'AWS::StackId'
  WritersAccessPolicy:
    Type: AWS::OpenSearchServerless::AccessPolicy
    Condition: HasDataWritePrincipals
    Properties:
      Name: !Sub
      - ${Name}-write
      - Name: !Join
        - '-'
        - - !Ref 'NamePrefix'
          - !Select
            - 0
            - !Split
              - '-'
              - !Select
                - 2
                - !Split
                  - /
                  - !Ref 'AWS::StackId'
      Type: data
      Policy: !Sub
      - '[{"Rules":[ {"ResourceType":"index","Resource":["index/${Name}/*"],"Permission":["aoss:CreateIndex","aoss:UpdateIndex","aoss:DescribeIndex","aoss:ReadDocument","aoss:WriteDocument"]}, {"ResourceType":"collection","Resource":["collection/${Name}"],"Permission":["aoss:CreateCollectionItems","aoss:DeleteCollectionItems","aoss:UpdateCollectionItems","aoss:DescribeCollectionItems"]}], "Principal":["${Principals}"]}]'
      - Principals: !Join
        - '","'
        - !Split
          - ','
          - !Ref 'DataWritePrincipals'
        Name: !Join
        - '-'
        - - !Ref 'NamePrefix'
          - !Select
            - 0
            - !Split
              - '-'
              - !Select
                - 2
                - !Split
                  - /
                  - !Ref 'AWS::StackId'
  PipelineLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub
      - /aws/vendedlogs/OpenSearchIngestion/${Name}/${Id}
      - Id: !Select
        - 2
        - !Split
          - /
          - !Ref 'AWS::StackId'
        Name: !Join
        - '-'
        - - !Ref 'NamePrefix'
          - !Select
            - 0
            - !Split
              - '-'
              - !Select
                - 2
                - !Split
                  - /
                  - !Ref 'AWS::StackId'
      RetentionInDays: 14
  Pipeline:
    Type: AWS::OSIS::Pipeline
    DependsOn: DataAccessPolicy
    Properties:
      PipelineName: !Join
      - '-'
      - - !Ref 'NamePrefix'
        - !Select
          - 0
          - !Split
            - '-'
            - !Select
              - 2
              - !Split
                - /
                - !Ref 'AWS::StackId'
      MinUnits: !Ref 'MinUnits'
      MaxUnits: !Ref 'MaxUnits'
      PipelineRoleArn: !GetAtt 'PipelineRole.Arn'
      LogPublishingOptions:
        IsLoggingEnabled: true
        CloudWatchLogDestination:
          LogGroup: !Ref 'PipelineLogGroup'
      PipelineConfigurationBody: !Sub
      - |
        version: '2'
        extension:
          osis_configuration_metadata:
            builder_type: visual

        # Main OTLP pipeline - receives all telemetry and routes by signal type
        otlp-pipeline:
          source:
            otlp:
              logs_path: '/${Name}/v1/logs'
              traces_path: '/${Name}/v1/traces'
              metrics_path: '/${Name}/v1/metrics'
          route:
            - logs: 'getEventType() == "LOG"'
            - traces: 'getEventType() == "TRACE"'
            - metrics: 'getEventType() == "METRIC"'
          processor: []
          sink:
            - pipeline:
                name: otel-logs-pipeline
                routes:
                  - logs
            - pipeline:
                name: otel-traces-pipeline
                routes:
                  - traces
            - pipeline:
                name: otel-metrics-pipeline
                routes:
                  - metrics

        # Log processing pipeline
        otel-logs-pipeline:
          source:
            pipeline:
              name: otlp-pipeline
          processor:
            - copy_values:
                entries:
                  - from_key: "time"
                    to_key: "@timestamp"
          sink:
            - opensearch:
                hosts:
                  - '${Collection.CollectionEndpoint}'
                index: 'hud-investigations-v1'
                template_type: 'index-template'
                template_content: '{"version":1,"template":{"mappings":{"date_detection":false,"_source":{"enabled":true},"dynamic_templates":[{"long_resource_attributes":{"mapping":{"type":"long"},"path_match":"resource.attributes.*","match_mapping_type":"long"}},{"double_resource_attributes":{"mapping":{"type":"double"},"path_match":"resource.attributes.*","match_mapping_type":"double"}},{"string_resource_attributes":{"mapping":{"type":"keyword","ignore_above":256},"path_match":"resource.attributes.*","match_mapping_type":"string"}},{"long_scope_attributes":{"mapping":{"type":"long"},"path_match":"instrumentationScope.attributes.*","match_mapping_type":"long"}},{"double_scope_attributes":{"mapping":{"type":"double"},"path_match":"instrumentationScope.attributes.*","match_mapping_type":"double"}},{"string_scope_attributes":{"mapping":{"type":"keyword","ignore_above":256},"path_match":"instrumentationScope.attributes.*","match_mapping_type":"string"}},{"long_attributes":{"mapping":{"type":"long"},"path_match":"attributes.*","match_mapping_type":"long"}},{"double_attributes":{"mapping":{"type":"double"},"path_match":"attributes.*","match_mapping_type":"double"}},{"string_attributes":{"mapping":{"type":"keyword","ignore_above":256},"path_match":"attributes.*","match_mapping_type":"string"}}],"properties":{"droppedAttributesCount":{"type":"integer"},"instrumentationScope":{"properties":{"droppedAttributesCount":{"type":"integer"},"schemaUrl":{"type":"keyword","ignore_above":256},"name":{"type":"keyword","ignore_above":128},"version":{"type":"keyword","ignore_above":64}}},"resource":{"properties":{"droppedAttributesCount":{"type":"integer"},"schemaUrl":{"type":"keyword","ignore_above":256}}},"severity":{"properties":{"number":{"type":"integer"},"text":{"type":"keyword","ignore_above":32}}},"body":{"type":"text"},"@timestamp":{"type":"date_nanos"},"time":{"type":"date_nanos"},"observedTime":{"type":"date_nanos"},"traceId":{"type":"keyword","ignore_above":32},"spanId":{"type":"keyword","ignore_above":16},"flags":{"type":"long"}}}}}'
                aws:
                  serverless: true
                  region: '${AWS::Region}'
                  sts_role_arn: "${PipelineRole.Arn}"

        # Trace fan-out pipeline
        otel-traces-pipeline:
          source:
            pipeline:
              name: otlp-pipeline
          processor: []
          sink:
            - pipeline:
                name: traces-raw-pipeline
                routes: []
            - pipeline:
                name: service-map-pipeline
                routes: []

        # Raw trace storage pipeline
        traces-raw-pipeline:
          source:
            pipeline:
              name: otel-traces-pipeline
          processor:
            - otel_traces:
          sink:
            - opensearch:
                hosts:
                  - '${Collection.CollectionEndpoint}'
                index: 'otel-v1-apm-span'
                template_type: 'index-template'
                template_content: '{"version":1,"template":{"mappings":{"date_detection":false,"_source":{"enabled":true},"dynamic_templates":[{"long_resource_attributes":{"mapping":{"type":"long"},"path_match":"resource.attributes.*","match_mapping_type":"long"}},{"double_resource_attributes":{"mapping":{"type":"double"},"path_match":"resource.attributes.*","match_mapping_type":"double"}},{"string_resource_attributes":{"mapping":{"type":"keyword","ignore_above":256},"path_match":"resource.attributes.*","match_mapping_type":"string"}},{"long_scope_attributes":{"mapping":{"type":"long"},"path_match":"instrumentationScope.attributes.*","match_mapping_type":"long"}},{"double_scope_attributes":{"mapping":{"type":"double"},"path_match":"instrumentationScope.attributes.*","match_mapping_type":"double"}},{"string_scope_attributes":{"mapping":{"type":"keyword","ignore_above":256},"path_match":"instrumentationScope.attributes.*","match_mapping_type":"string"}},{"long_attributes":{"mapping":{"type":"long"},"path_match":"attributes.*","match_mapping_type":"long"}},{"double_attributes":{"mapping":{"type":"double"},"path_match":"attributes.*","match_mapping_type":"double"}},{"string_attributes":{"mapping":{"type":"keyword","ignore_above":256},"path_match":"attributes.*","match_mapping_type":"string"}}],"properties":{"droppedAttributesCount":{"type":"integer"},"instrumentationScope":{"properties":{"droppedAttributesCount":{"type":"integer"},"schemaUrl":{"type":"keyword","ignore_above":256},"name":{"type":"keyword","ignore_above":128},"version":{"type":"keyword","ignore_above":64}}},"resource":{"properties":{"droppedAttributesCount":{"type":"integer"},"schemaUrl":{"type":"keyword","ignore_above":256}}},"traceId":{"type":"keyword","ignore_above":32},"spanId":{"type":"keyword","ignore_above":16},"parentSpanId":{"type":"keyword","ignore_above":16},"name":{"ignore_above":1024,"type":"keyword"},"traceState":{"ignore_above":1024,"type":"keyword"},"traceGroup":{"ignore_above":1024,"type":"keyword"},"traceGroupFields":{"properties":{"endTime":{"type":"date_nanos"},"durationInNanos":{"type":"long"},"statusCode":{"type":"integer"}}},"kind":{"type":"keyword","ignore_above":32},"serviceName":{"type":"keyword","ignore_above":256},"startTime":{"type":"date_nanos"},"endTime":{"type":"date_nanos"},"@timestamp":{"type":"date_nanos"},"time":{"type":"date_nanos"},"status":{"properties":{"code":{"type":"integer"},"message":{"type":"keyword","ignore_above":2048}}},"durationInNanos":{"type":"long"},"events":{"type":"nested","properties":{"name":{"type":"keyword","ignore_above":256},"attributes":{"type":"object"},"droppedAttributesCount":{"type":"integer"},"time":{"type":"date_nanos"}}},"droppedEventsCount":{"type":"integer"},"links":{"type":"nested","properties":{"traceId":{"type":"keyword","ignore_above":32},"spanId":{"type":"keyword","ignore_above":16},"traceState":{"ignore_above":1024,"type":"keyword"},"attributes":{"type":"object"},"droppedAttributesCount":{"type":"integer"}}},"droppedLinksCount":{"type":"integer"}}}}}'
                aws:
                  serverless: true
                  region: '${AWS::Region}'
                  sts_role_arn: "${PipelineRole.Arn}"

        # Service map generation pipeline (APM)
        service-map-pipeline:
          source:
            pipeline:
              name: otel-traces-pipeline
          processor:
            - otel_apm_service_map:
                db_path: /tmp/otel-apm-service-map
                group_by_attributes:
                  - telemetry.sdk.language
                window_duration: ${ServiceMapWindow}
          route:
            - otel_apm_service_map_route: 'getEventType() == "SERVICE_MAP"'
            - service_processed_metrics: 'getEventType() == "METRIC"'
          sink:
            - opensearch:
                hosts:
                  - '${Collection.CollectionEndpoint}'
                aws:
                  serverless: true
                  region: '${AWS::Region}'
                  sts_role_arn: "${PipelineRole.Arn}"
                routes:
                  - otel_apm_service_map_route
                index: 'otel-v2-apm-service-map'
                template_type: 'index-template'
                template_content: '{"version":0,"template":{"mappings":{"date_detection":false,"dynamic_templates":[{"long_group_by_attributes":{"path_match":"*.groupByAttributes.*","match_mapping_type":"long","mapping":{"type":"long"}}},{"double_group_by_attributes":{"path_match":"*.groupByAttributes.*","match_mapping_type":"double","mapping":{"type":"double"}}},{"string_group_by_attributes":{"path_match":"*.groupByAttributes.*","match_mapping_type":"string","mapping":{"type":"keyword"}}},{"long_operation_attributes":{"path_match":"*.attributes.*","match_mapping_type":"long","mapping":{"type":"long"}}},{"double_operation_attributes":{"path_match":"*.attributes.*","match_mapping_type":"double","mapping":{"type":"double"}}},{"string_operation_attributes":{"path_match":"*.attributes.*","match_mapping_type":"string","mapping":{"type":"keyword"}}}],"_source":{"enabled":true},"properties":{"sourceNode":{"properties":{"type":{"type":"keyword"},"keyAttributes":{"properties":{"environment":{"type":"keyword"},"name":{"type":"keyword"}}},"groupByAttributes":{"type":"object","dynamic":"true"}}},"targetNode":{"properties":{"type":{"type":"keyword"},"keyAttributes":{"properties":{"environment":{"type":"keyword"},"name":{"type":"keyword"}}},"groupByAttributes":{"type":"object","dynamic":"true"}}},"sourceOperation":{"properties":{"name":{"type":"keyword"},"attributes":{"type":"object","dynamic":"true"}}},"targetOperation":{"properties":{"name":{"type":"keyword"},"attributes":{"type":"object","dynamic":"true"}}},"nodeConnectionHash":{"type":"keyword"},"operationConnectionHash":{"type":"keyword"},"timestamp":{"type":"date","format":"strict_date_optional_time||epoch_millis"}}}}}'
            - prometheus:
                url: 'https://aps-workspaces.${AWS::Region}.amazonaws.com/workspaces/${Workspace.WorkspaceId}/api/v1/remote_write'
                aws:
                  region: '${AWS::Region}'
                routes:
                  - service_processed_metrics

        # Metrics processing pipeline
        otel-metrics-pipeline:
          source:
            pipeline:
              name: otlp-pipeline
          processor:
            - otel_metrics:
          sink:
            - prometheus:
                url: 'https://aps-workspaces.${AWS::Region}.amazonaws.com/workspaces/${Workspace.WorkspaceId}/api/v1/remote_write'
                aws:
                  region: '${AWS::Region}'
      - Name: !Join
        - '-'
        - - !Ref 'NamePrefix'
          - !Select
            - 0
            - !Split
              - '-'
              - !Select
                - 2
                - !Split
                  - /
                  - !Ref 'AWS::StackId'
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/hud/${AWS::StackName}'
      RetentionInDays: 14
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: ecs-tasks.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy'
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: ecs-tasks.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: amp-remote-write
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: aps:RemoteWrite
            Resource: !Sub 'arn:${AWS::Partition}:aps:${AWS::Region}:${AWS::AccountId}:workspace/${Workspace.WorkspaceId}'
      - PolicyName: osis-ingest
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: osis:Ingest
            Resource: !Sub
            - arn:${AWS::Partition}:osis:${AWS::Region}:${AWS::AccountId}:pipeline/${Name}
            - Name: !Join
              - '-'
              - - !Ref 'NamePrefix'
                - !Select
                  - 0
                  - !Split
                    - '-'
                    - !Select
                      - 2
                      - !Split
                        - /
                        - !Ref 'AWS::StackId'
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Hud collector OTLP/HTTP
      VpcId: !Ref 'VpcId'
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 4318
        ToPort: 4318
        CidrIp: !Ref 'AllowedCidr'
  Namespace:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Properties:
      Name: !Ref 'DnsNamespace'
      Vpc: !Ref 'VpcId'
  DiscoveryService:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: hud-collector
      NamespaceId: !Ref 'Namespace'
      DnsConfig:
        DnsRecords:
        - Type: A
          TTL: 10
      HealthCheckCustomConfig:
        FailureThreshold: 1
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AWS::StackName}'
      RequiresCompatibilities:
      - FARGATE
      NetworkMode: awsvpc
      Cpu: !Ref 'Cpu'
      Memory: !Ref 'Memory'
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: !Ref 'CpuArchitecture'
      ExecutionRoleArn: !GetAtt 'ExecutionRole.Arn'
      TaskRoleArn: !GetAtt 'TaskRole.Arn'
      ContainerDefinitions:
      - Name: collector
        Image: !Ref 'Image'
        Essential: true
        Command:
        - --config
        - env:HUD_OTELCOL_CONFIG
        PortMappings:
        - ContainerPort: 4318
          Protocol: tcp
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: !Ref 'LogGroup'
            awslogs-region: !Ref 'AWS::Region'
            awslogs-stream-prefix: collector
        Environment:
        - Name: AMP_REMOTE_WRITE_URL
          Value: !Sub
          - https://aps-workspaces.${AWS::Region}.amazonaws.com/workspaces/${Ws}/api/v1/remote_write
          - Ws: !GetAtt 'Workspace.WorkspaceId'
        - Name: HUD_OTELCOL_CONFIG
          Value: !Sub
          - |
            extensions:
              health_check:
                endpoint: 0.0.0.0:13133
              sigv4auth:
                region: ${AWS::Region}
                service: aps
              ${OsisAuth}
            receivers:
              otlp:
                protocols:
                  http:
                    endpoint: 0.0.0.0:4318
            processors:
              memory_limiter:
                check_interval: 1s
                limit_percentage: 80
                spike_limit_percentage: 20
              filter/functions:
                metrics:
                  metric: ['not IsMatch(name, "^code\\.function\\.")']
              filter/per_pod:
                metrics:
                  metric: ['IsMatch(name, "^code\\.function\\.")']
              batch:
              transform/merge:
                metric_statements:
                  - context: resource
                    statements:
                      - keep_keys(attributes, ["service.name", "service.namespace", "deployment.environment.name", "deployment.id", "k8s.namespace.name", "cloud.provider", "cloud.region", "telemetry.sdk.version", "hud.identity.version"])
                  - context: datapoint
                    statements:
                      - merge_maps(attributes, resource.attributes, "insert")
                      - delete_matching_keys(attributes, "^service\\.(name|namespace)$")
                  - context: resource
                    statements:
                      - keep_keys(attributes, ["service.name", "service.namespace"])
                      - set(attributes["service.instance.id"], "${!env:HOSTNAME}")
              transform/environment:
                metric_statements:
                  - context: datapoint
                    statements:
                      - set(attributes["deployment.environment.name"], resource.attributes["deployment.environment.name"]) where resource.attributes["deployment.environment.name"] != nil
              transform/restamp:
                metric_statements:
                  - context: datapoint
                    statements: ['set(start_time, Now())', 'set(time, Now())']
              delta_to_cumulative:
                max_stale: 1h
              interval:
                interval: ${ExportInterval}s
            exporters:
              prometheus_remote_write:
                endpoint: ${!env:AMP_REMOTE_WRITE_URL}
                auth:
                  authenticator: sigv4auth
              ${OsisExporter}
            service:
              extensions: ${Extensions}
              pipelines:
                ${FunctionsPipeline}
                ${PerPodPipeline}
                ${LogsPipeline}
          - FunctionsPipeline: !If
            - Merge
            - 'metrics/functions: {receivers: [otlp], processors: [memory_limiter, filter/functions, batch, transform/merge, transform/restamp, delta_to_cumulative, interval], exporters: [prometheus_remote_write]}'
            - ''
            PerPodPipeline: !If
            - Merge
            - 'metrics/per_pod: {receivers: [otlp], processors: [memory_limiter, filter/per_pod, batch, transform/environment, delta_to_cumulative], exporters: [prometheus_remote_write]}'
            - 'metrics: {receivers: [otlp], processors: [memory_limiter, batch, transform/environment, delta_to_cumulative], exporters: [prometheus_remote_write]}'
            OsisAuth: !Sub 'sigv4auth/osis: {region: ''${AWS::Region}'', service: osis}'
            OsisExporter: !Sub
            - 'otlp_http/osis: {logs_endpoint: ''${OsisLogsUrl}'', auth: {authenticator: sigv4auth/osis}, compression: none}'
            - OsisLogsUrl: !Sub
              - https://${Host}/${Name}/v1/logs
              - Host: !Select
                - 0
                - !GetAtt 'Pipeline.IngestEndpointUrls'
                Name: !Join
                - '-'
                - - !Ref 'NamePrefix'
                  - !Select
                    - 0
                    - !Split
                      - '-'
                      - !Select
                        - 2
                        - !Split
                          - /
                          - !Ref 'AWS::StackId'
            Extensions: '[health_check, sigv4auth, sigv4auth/osis]'
            LogsPipeline: 'logs: {receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlp_http/osis]}'
