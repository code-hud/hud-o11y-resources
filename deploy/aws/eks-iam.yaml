AWSTemplateFormatVersion: "2010-09-09"
Description: IAM role that lets the Hud OpenTelemetry collector on EKS write to Amazon Managed Service for Prometheus.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: EKS only - the collector's IAM role }
        Parameters: [ClusterName, AuthMode, OidcProvider, Namespace, ServiceAccount, AmpWorkspaceId, OsisLogsUrl, OsisPipelineName, TemplatesUrl]

Parameters:
  ClusterName:
    Type: String
    Description: Your EKS cluster the collector runs in.
  AuthMode:
    Type: String
    Default: PodIdentity
    AllowedValues: [PodIdentity, IRSA]
    Description: PodIdentity needs the eks-pod-identity-agent add-on. IRSA needs the cluster's IAM OIDC provider.
  OidcProvider:
    Type: String
    Default: ""
    Description: IRSA only. The cluster's OIDC issuer without https://, e.g. oidc.eks.us-east-1.amazonaws.com/id/EXAMPLE
  Namespace:
    Type: String
    Default: hud
  ServiceAccount:
    Type: String
    Default: hud-collector
  AmpWorkspaceId:
    Type: String
    Default: ""
    Description: Your existing AMP workspace id (ws-...). Leave empty to create one.
  OsisLogsUrl:
    Type: String
    Default: ""
    Description: Optional. Full OTLP logs URL of your OpenSearch Ingestion pipeline, e.g. https://<pipeline>.us-east-1.osis.amazonaws.com/<pipeline-name>/v1/logs. Lets the collector send Hud investigations to OpenSearch.
  OsisPipelineName:
    Type: String
    Default: ""
    Description: Name of that pipeline (required with OsisLogsUrl), for osis:Ingest.
  TemplatesUrl:
    Type: String
    Default: https://hud-cloudformation-templates.s3.amazonaws.com/templates
    Description: Where this stack's nested templates are published (no trailing slash). Each published template points at its own version's folder; change it only to test your own copy.

Rules:
  IrsaNeedsOidc:
    RuleCondition: !Equals [!Ref AuthMode, IRSA]
    Assertions:
      - Assert: !Not [!Equals [!Ref OidcProvider, ""]]
        AssertDescription: OidcProvider is required when AuthMode is IRSA.
  OsisNeedsPipelineName:
    RuleCondition: !Not [!Equals [!Ref OsisLogsUrl, ""]]
    Assertions:
      - Assert: !Not [!Equals [!Ref OsisPipelineName, ""]]
        AssertDescription: OsisPipelineName is required when OsisLogsUrl is set.

Conditions:
  CreateAmp: !Equals [!Ref AmpWorkspaceId, ""]
  PodIdentity: !Equals [!Ref AuthMode, PodIdentity]
  Logs: !Not [!Equals [!Ref OsisLogsUrl, ""]]

Resources:
  AmpWorkspace:
    Type: AWS::APS::Workspace
    Condition: CreateAmp
    Properties:
      Alias: !Sub ${AWS::StackName}

  # Only in a workspace this stack creates: yours may already have the rules (deploy hud-hourly-rules.yaml if not).
  HourlyRecordingRules:
    Type: AWS::CloudFormation::Stack
    Condition: CreateAmp
    Properties:
      TemplateURL: !Sub ${TemplatesUrl}/hud-hourly-rules.yaml
      Parameters:
        AmpWorkspaceId: !GetAtt AmpWorkspace.WorkspaceId

  Role:
    Type: AWS::IAM::Role
    Properties:
      # A JSON string because the IRSA condition keys contain the OIDC provider, and YAML keys can't use !Sub.
      AssumeRolePolicyDocument: !If
        - PodIdentity
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal: { Service: pods.eks.amazonaws.com }
              Action: [sts:AssumeRole, sts:TagSession]
        - !Sub |
          {
            "Version": "2012-10-17",
            "Statement": [{
              "Effect": "Allow",
              "Principal": { "Federated": "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/${OidcProvider}" },
              "Action": "sts:AssumeRoleWithWebIdentity",
              "Condition": { "StringEquals": {
                "${OidcProvider}:sub": "system:serviceaccount:${Namespace}:${ServiceAccount}",
                "${OidcProvider}:aud": "sts.amazonaws.com"
              }}
            }]
          }
      Policies:
        - PolicyName: amp-remote-write
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: aps:RemoteWrite
                Resource: !If
                  - CreateAmp
                  - !GetAtt AmpWorkspace.Arn
                  - !Sub arn:${AWS::Partition}:aps:${AWS::Region}:${AWS::AccountId}:workspace/${AmpWorkspaceId}
        - !If
          - Logs
          - PolicyName: osis-ingest
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: osis:Ingest
                  Resource: !Sub arn:${AWS::Partition}:osis:${AWS::Region}:${AWS::AccountId}:pipeline/${OsisPipelineName}
          - !Ref AWS::NoValue

  PodIdentityAssociation:
    Type: AWS::EKS::PodIdentityAssociation
    Condition: PodIdentity
    # hud.yaml makes ClusterName optional; its Rules require it whenever this is created.
    Metadata:
      cfn-lint: { config: { ignore_checks: [W1030] } }
    Properties:
      ClusterName: !Ref ClusterName
      Namespace: !Ref Namespace
      ServiceAccount: !Ref ServiceAccount
      RoleArn: !GetAtt Role.Arn

Outputs:
  RoleArn:
    Description: IRSA only - set as serviceAccount.annotations."eks.amazonaws.com/role-arn" in the Helm values.
    Value: !GetAtt Role.Arn
  AmpRemoteWriteUrl:
    Description: Pass to Helm as AMP_REMOTE_WRITE_URL.
    Value: !Sub
      - https://aps-workspaces.${AWS::Region}.amazonaws.com/workspaces/${Ws}/api/v1/remote_write
      - Ws: !If [CreateAmp, !GetAtt AmpWorkspace.WorkspaceId, !Ref AmpWorkspaceId]
  OsisLogsUrl:
    Condition: Logs
    Description: Pass to Helm as OSIS_LOGS_URL.
    Value: !Ref OsisLogsUrl
  AmpWorkspaceId:
    Description: The AMP workspace the collector writes to.
    Value: !If [CreateAmp, !GetAtt AmpWorkspace.WorkspaceId, !Ref AmpWorkspaceId]
  AmpQueryUrl:
    Value: !Sub
      - https://aps-workspaces.${AWS::Region}.amazonaws.com/workspaces/${Ws}/api/v1/query
      - Ws: !If [CreateAmp, !GetAtt AmpWorkspace.WorkspaceId, !Ref AmpWorkspaceId]
