AWSTemplateFormatVersion: "2010-09-09"
Description: Read-only IAM role that Hud's AWS account can assume to query your data through your OpenSearch UI application (PromQL on AMP, PPL on your OpenSearch Serverless collection). Delete the stack to revoke access.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Hud access }
        Parameters: [ExternalId]
      - Label: { default: Data to share }
        Parameters: [UiAppId, DirectQueryDataSourceName, CollectionName]

Parameters:
  ExternalId:
    Type: String
    MinLength: 2
    MaxLength: 1224
    AllowedPattern: ^[\w+=,.@:/-]+$
    Description: Prefilled by Hud's onboarding link and unique to you. Don't change it; Hud sends it when assuming the role, so with any other value Hud can't read your data.
  UiAppId:
    Type: String
    AllowedPattern: ^[a-z0-9]{3,30}$
    Description: Your OpenSearch UI application id (aws opensearch list-applications). Hud signs in to it and queries your data through it.
  DirectQueryDataSourceName:
    Type: String
    AllowedPattern: ^[a-z][a-z0-9_]+$
    Description: Your AMP direct-query data source in that app (aws opensearch list-direct-query-data-sources), which Hud queries with PromQL.
  CollectionName:
    Type: String
    Default: ""
    Description: Optional. Your OpenSearch Serverless collection Hud may read (investigations). Empty for metrics only.

Conditions:
  HasCollection: !Not [!Equals [!Ref CollectionName, ""]]

Resources:
  HudRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: arn:aws:iam::736129612463:root # Hud's AWS account
            Action: sts:AssumeRole
            Condition:
              StringEquals: { sts:ExternalId: !Ref ExternalId }
      # Hud's backend may only assume roles tagged hud=allowed.
      Tags:
        - Key: hud
          Value: allowed
      Policies:
        # The actions of the session policy Hud assumes the role with; anything else would be filtered out. Its
        # es:DescribeApplication is left out: IAM has no such action.
        - PolicyName: opensearch-ui
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: opensearch:ApplicationAccessAll
                Resource: !Sub arn:${AWS::Partition}:opensearch:${AWS::Region}:${AWS::AccountId}:application/${UiAppId}
              - Effect: Allow
                Action: [es:ESHttpGet, es:ESHttpPost, es:GetApplication]
                Resource:
                  - !Sub arn:${AWS::Partition}:opensearch:${AWS::Region}:${AWS::AccountId}:application/${UiAppId}
                  - !Sub arn:${AWS::Partition}:opensearch:${AWS::Region}:${AWS::AccountId}:application/${UiAppId}/*
              - Effect: Allow
                Action: es:ListApplications
                Resource: "*"
              # PromQL through the app runs as the caller; the data source's own role reads AMP.
              - Effect: Allow
                Action: [opensearch:StartDirectQuery, opensearch:GetDirectQuery, opensearch:GetDirectQueryResult, opensearch:CancelDirectQuery]
                Resource: !Sub arn:${AWS::Partition}:opensearch:${AWS::Region}:${AWS::AccountId}:datasource/${DirectQueryDataSourceName}
        - !If
          - HasCollection
          # The app queries OpenSearch Serverless as the caller, which needs aoss:APIAccessAll; HudDataAccessPolicy limits
          # it to reading. The condition keeps it to this collection even if another one's data access policy grants your account root.
          - PolicyName: opensearch-read
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: aoss:APIAccessAll
                  Resource: !Sub arn:${AWS::Partition}:aoss:${AWS::Region}:${AWS::AccountId}:collection/*
                  Condition:
                    StringEquals: { aoss:collection: !Ref CollectionName }
          - !Ref AWS::NoValue

  HudDataAccessPolicy:
    Type: AWS::OpenSearchServerless::AccessPolicy
    Condition: HasCollection
    Properties:
      Name: !Sub ${CollectionName}-hud
      Type: data
      Policy: !Sub >-
        [{"Rules":[
        {"ResourceType":"index","Resource":["index/${CollectionName}/*"],"Permission":["aoss:DescribeIndex","aoss:ReadDocument"]},
        {"ResourceType":"collection","Resource":["collection/${CollectionName}"],"Permission":["aoss:DescribeCollectionItems"]}],
        "Principal":["${HudRole.Arn}"]}]

Outputs:
  HudRoleArn:
    Description: Give this to Hud.
    Value: !GetAtt HudRole.Arn
  HudExternalId:
    Description: The ExternalId Hud generated for you, for reference.
    Value: !Ref ExternalId
