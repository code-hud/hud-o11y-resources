# Hud day-over-week degradation on the Hud SDK metrics in AMP.
# Matches Hud's day-over-week degradation detection: current [now-1d, now] vs reference [now-8d, now-1d], invocations_min=100,
# buckets_with_invocations_min=[12, 84]; avg hourly p90 ratio >= +70%, window p90 >= 150ms, sd/avg <= 1, non-overlapping 99% CIs.
# Hud runs this only on demand; this rule is a scheduled equivalent (hourly).
# $value = current-day avg hourly p90 / previous-7-day avg hourly p90.
# No flow-type selector: one rule shape covers every flow type (http, graphql, grpc, kafka, sqs, queues, custom, ...).
# Hud itself only runs degradation on endpoint + kafka entities, so this alerts on more flows than Hud does.
# code_flow_duration_seconds is a native histogram: histogram_quantile / histogram_count work on increase() of it.
# "hourly p90" = histogram_quantile(0.9, sum by (...) (increase(...[1h]))) evaluated at 1h steps (subquery, epoch-aligned),
# empty hours are dropped (> 0), like Hud's "buckets with invocations".
groups:
  - name: hud-flow-day-over-week-degradation
    interval: 1h
    rules:
      - alert: HudDayOverWeekDegradation
        expr: |
          (
            avg_over_time((histogram_quantile(0.9, sum by (service_name, deployment_environment_name, code_flow_type, code_flow_name, http_request_method, http_route) (increase(code_flow_duration_seconds[1h]))) > 0)[1d:1h])
            / on (service_name, deployment_environment_name, code_flow_type, code_flow_name, http_request_method, http_route)
            avg_over_time((histogram_quantile(0.9, sum by (service_name, deployment_environment_name, code_flow_type, code_flow_name, http_request_method, http_route) (increase(code_flow_duration_seconds[1h]))) > 0)[7d:1h] offset 1d)
          ) >= 1.7
          and on (service_name, deployment_environment_name, code_flow_type, code_flow_name, http_request_method, http_route) (count_over_time((histogram_quantile(0.9, sum by (service_name, deployment_environment_name, code_flow_type, code_flow_name, http_request_method, http_route) (increase(code_flow_duration_seconds[1h]))) > 0)[1d:1h]) >= 12)
          and on (service_name, deployment_environment_name, code_flow_type, code_flow_name, http_request_method, http_route) (count_over_time((histogram_quantile(0.9, sum by (service_name, deployment_environment_name, code_flow_type, code_flow_name, http_request_method, http_route) (increase(code_flow_duration_seconds[1h]))) > 0)[7d:1h] offset 1d) >= 84)
          and on (service_name, deployment_environment_name, code_flow_type, code_flow_name, http_request_method, http_route) (stddev_over_time((histogram_quantile(0.9, sum by (service_name, deployment_environment_name, code_flow_type, code_flow_name, http_request_method, http_route) (increase(code_flow_duration_seconds[1h]))) > 0)[1d:1h]) / avg_over_time((histogram_quantile(0.9, sum by (service_name, deployment_environment_name, code_flow_type, code_flow_name, http_request_method, http_route) (increase(code_flow_duration_seconds[1h]))) > 0)[1d:1h]) <= 1)
          and on (service_name, deployment_environment_name, code_flow_type, code_flow_name, http_request_method, http_route) (stddev_over_time((histogram_quantile(0.9, sum by (service_name, deployment_environment_name, code_flow_type, code_flow_name, http_request_method, http_route) (increase(code_flow_duration_seconds[1h]))) > 0)[7d:1h] offset 1d) / avg_over_time((histogram_quantile(0.9, sum by (service_name, deployment_environment_name, code_flow_type, code_flow_name, http_request_method, http_route) (increase(code_flow_duration_seconds[1h]))) > 0)[7d:1h] offset 1d) <= 1)
          and on (service_name, deployment_environment_name, code_flow_type, code_flow_name, http_request_method, http_route) (
            (avg_over_time((histogram_quantile(0.9, sum by (service_name, deployment_environment_name, code_flow_type, code_flow_name, http_request_method, http_route) (increase(code_flow_duration_seconds[1h]))) > 0)[7d:1h] offset 1d) + 2.58 * stddev_over_time((histogram_quantile(0.9, sum by (service_name, deployment_environment_name, code_flow_type, code_flow_name, http_request_method, http_route) (increase(code_flow_duration_seconds[1h]))) > 0)[7d:1h] offset 1d) / sqrt(count_over_time((histogram_quantile(0.9, sum by (service_name, deployment_environment_name, code_flow_type, code_flow_name, http_request_method, http_route) (increase(code_flow_duration_seconds[1h]))) > 0)[7d:1h] offset 1d)))
            < (avg_over_time((histogram_quantile(0.9, sum by (service_name, deployment_environment_name, code_flow_type, code_flow_name, http_request_method, http_route) (increase(code_flow_duration_seconds[1h]))) > 0)[1d:1h]) - 2.58 * stddev_over_time((histogram_quantile(0.9, sum by (service_name, deployment_environment_name, code_flow_type, code_flow_name, http_request_method, http_route) (increase(code_flow_duration_seconds[1h]))) > 0)[1d:1h]) / sqrt(count_over_time((histogram_quantile(0.9, sum by (service_name, deployment_environment_name, code_flow_type, code_flow_name, http_request_method, http_route) (increase(code_flow_duration_seconds[1h]))) > 0)[1d:1h])))
          )
          and on (service_name, deployment_environment_name, code_flow_type, code_flow_name, http_request_method, http_route) (histogram_quantile(0.9, sum by (service_name, deployment_environment_name, code_flow_type, code_flow_name, http_request_method, http_route) (increase(code_flow_duration_seconds[1d]))) >= 0.15)
          and on (service_name, deployment_environment_name, code_flow_type, code_flow_name, http_request_method, http_route) (sum by (service_name, deployment_environment_name, code_flow_type, code_flow_name, http_request_method, http_route) (histogram_count(increase(code_flow_duration_seconds[1d]))) >= 100)
          and on (service_name, deployment_environment_name, code_flow_type, code_flow_name, http_request_method, http_route) (sum by (service_name, deployment_environment_name, code_flow_type, code_flow_name, http_request_method, http_route) (histogram_count(increase(code_flow_duration_seconds[7d] offset 1d))) >= 100)
        for: 0m
        labels:
          severity: warning
          endpoint_method: "{{ $labels.http_request_method }}"
          endpoint_path: '{{ if $labels.http_route }}{{ $labels.http_route }}{{ else }}{{ $labels.code_flow_name }}{{ end }}'
        annotations:
          summary: "Hud-style day-over-week p90 degradation on {{ $labels.service_name }} {{ $labels.code_flow_name }}"
          description: "Average hourly p90 over the last 24h is {{ $value | humanize }}x the preceding 7 days (alert at >= 1.7x, >= 100 invocations per window, >= 12 hourly buckets today and >= 84 in the baseline, p90 >= 150ms)."
