# Hud endpoint latency spike on the Hud SDK metrics in AMP.
# Modelled on Hud's spike degradation detection with its intended configuration:
# current [now-10m, now] vs reference [now-1d, now-10m], 10-minute buckets;
# invocations_min=50 in both windows, window p90 >= 300ms, current p90 / avg 10m-bucket p90 of the reference >= 1.7,
# reference sd/avg <= 1, 99% CI of the reference strictly below the current p90, and >= 72 reference buckets with data
# (assumption: half of 144 buckets in a day). $value = current p90 / reference avg 10m-bucket p90.
# Evaluated every 10m, as Hud does. For: 0m, windows end at now (no lag).
# No flow-type selector: one rule shape covers every flow type (http, graphql, grpc, kafka, sqs, queues, custom, ...).
# Hud itself only runs degradation on endpoint + kafka entities, so this alerts on more flows than Hud does.
# code_flow_duration_seconds is a native histogram: histogram_quantile / histogram_count work on increase() of it.
# "hourly p90" = histogram_quantile(0.9, sum by (...) (increase(...[1h]))) evaluated at 1h steps (subquery, epoch-aligned),
# empty hours are dropped (> 0), like Hud's "buckets with invocations".
groups:
  - name: hud-latency-spike
    interval: 10m
    rules:
      - alert: HudLatencySpike
        expr: |
          (
            (histogram_quantile(0.9, sum by (service_name, deployment_environment_name, code_flow_type, code_flow_name, http_request_method, http_route) (increase(code_flow_duration_seconds[10m]))) > 0)
            / on (service_name, deployment_environment_name, code_flow_type, code_flow_name, http_request_method, http_route)
            avg_over_time((histogram_quantile(0.9, sum by (service_name, deployment_environment_name, code_flow_type, code_flow_name, http_request_method, http_route) (increase(code_flow_duration_seconds[10m]))) > 0)[23h50m:10m] offset 10m)
          ) >= 1.7
          and on (service_name, deployment_environment_name, code_flow_type, code_flow_name, http_request_method, http_route) ((histogram_quantile(0.9, sum by (service_name, deployment_environment_name, code_flow_type, code_flow_name, http_request_method, http_route) (increase(code_flow_duration_seconds[10m]))) > 0) >= 0.3)
          and on (service_name, deployment_environment_name, code_flow_type, code_flow_name, http_request_method, http_route) (count_over_time((histogram_quantile(0.9, sum by (service_name, deployment_environment_name, code_flow_type, code_flow_name, http_request_method, http_route) (increase(code_flow_duration_seconds[10m]))) > 0)[23h50m:10m] offset 10m) >= 72)
          and on (service_name, deployment_environment_name, code_flow_type, code_flow_name, http_request_method, http_route) (stddev_over_time((histogram_quantile(0.9, sum by (service_name, deployment_environment_name, code_flow_type, code_flow_name, http_request_method, http_route) (increase(code_flow_duration_seconds[10m]))) > 0)[23h50m:10m] offset 10m) / avg_over_time((histogram_quantile(0.9, sum by (service_name, deployment_environment_name, code_flow_type, code_flow_name, http_request_method, http_route) (increase(code_flow_duration_seconds[10m]))) > 0)[23h50m:10m] offset 10m) <= 1)
          and on (service_name, deployment_environment_name, code_flow_type, code_flow_name, http_request_method, http_route) ((avg_over_time((histogram_quantile(0.9, sum by (service_name, deployment_environment_name, code_flow_type, code_flow_name, http_request_method, http_route) (increase(code_flow_duration_seconds[10m]))) > 0)[23h50m:10m] offset 10m) + 2.58 * stddev_over_time((histogram_quantile(0.9, sum by (service_name, deployment_environment_name, code_flow_type, code_flow_name, http_request_method, http_route) (increase(code_flow_duration_seconds[10m]))) > 0)[23h50m:10m] offset 10m) / sqrt(count_over_time((histogram_quantile(0.9, sum by (service_name, deployment_environment_name, code_flow_type, code_flow_name, http_request_method, http_route) (increase(code_flow_duration_seconds[10m]))) > 0)[23h50m:10m] offset 10m))) < (histogram_quantile(0.9, sum by (service_name, deployment_environment_name, code_flow_type, code_flow_name, http_request_method, http_route) (increase(code_flow_duration_seconds[10m]))) > 0))
          and on (service_name, deployment_environment_name, code_flow_type, code_flow_name, http_request_method, http_route) (sum by (service_name, deployment_environment_name, code_flow_type, code_flow_name, http_request_method, http_route) (histogram_count(increase(code_flow_duration_seconds[10m]))) >= 50)
          and on (service_name, deployment_environment_name, code_flow_type, code_flow_name, http_request_method, http_route) (sum by (service_name, deployment_environment_name, code_flow_type, code_flow_name, http_request_method, http_route) (histogram_count(increase(code_flow_duration_seconds[23h50m] offset 10m))) >= 50)
        for: 0m
        labels:
          severity: warning
          endpoint_method: "{{ $labels.http_request_method }}"
          endpoint_path: '{{ if $labels.http_route }}{{ $labels.http_route }}{{ else }}{{ $labels.code_flow_name }}{{ end }}'
        annotations:
          summary: "Hud-style latency spike on {{ $labels.service_name }} {{ $labels.code_flow_name }}"
          description: "p90 over the last 10m is {{ $value | humanize }}x the average 10m p90 of the previous day (alert at >= 1.7x, >= 50 invocations per window, p90 >= 300ms)."
