name: dashboard-loader-tests

# Runs opensearch-ui/tests against the dashboards in opensearch-ui/dashboards/ on the oldest Python the loader
# supports (3.10, see opensearch-ui/README.md) and the newest (3.14). Each runs in the official python image, since the
# runner OS doesn't ship every Python version. Standard library only: nothing to install.
on:
  pull_request:
    paths: ["opensearch-ui/**", ".github/workflows/dashboard-loader-tests.yaml"]
  push:
    branches: [main]
    paths: ["opensearch-ui/**", ".github/workflows/dashboard-loader-tests.yaml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    container:
      image: python:${{ matrix.python-version }}-slim
    steps:
      - uses: actions/checkout@v7
      - run: python3 --version && python3 -m unittest discover -s opensearch-ui/tests -v
